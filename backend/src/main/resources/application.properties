server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGO_URI}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}


# jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
# jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

# SMTP / Brevo configuration
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
mail.from=${MAIL_FROM:}
mail.sender.name=${MAIL_SENDER_NAME:StudentPG}

# Brevo API configuration (used as fallback when SMTP is blocked)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:StudentPG}

# Production-safe defaults for mail behavior
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.debug=false

spring.data.mongodb.auto-index-creation=${MONGO_AUTO_INDEX:true}
admin.seed.email=${ADMIN_EMAIL:admin@studentpg.com}
admin.seed.password=${ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB
server.servlet.encoding.charset=UTF-8

server.servlet.encoding.enabled=true

server.servlet.encoding.force=true

server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=200

server.tomcat.accept-count=100

server.tomcat.connection-timeout=20s
logging.level.root=INFO

logging.level.org.springframework.security=WARN

logging.level.org.mongodb.driver=WARN
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,https://studentpg.in,https://www.studentpg.in}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

server.tomcat.max-swallow-size=20MB
app.cookie.domain=${COOKIE_DOMAIN:}



brevo.url=https://api.brevo.com/v3/smtp/email
spring.servlet.multipart.resolve-lazily=true
logging.level.org.springframework.web=WARN

server.server-header=
server.error.whitelabel.enabled=false

server.error.include-stacktrace=never

server.error.include-exception=false 

server.error.include-binding-errors=never 
server.error.include-message=never
spring.main.banner-mode=off
spring.data.mongodb.uuid-representation=standard 
spring.mvc.throw-exception-if-no-handler-found=true 
spring.web.resources.add-mappings=false
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.hiddenmethod.filter.enabled=false
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.enabled=true
spring.security.filter.dispatcher-types=REQUEST,ASYNC

# Set HMAC CAPTCHA Secret via Env Variable (Fallback provided)
app.captcha.secret=${CAPTCHA_SECRET:}