# Test profile overrides - loaded on top of src/main/resources/application.properties
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/test_db}
app.captcha.secret=${CAPTCHA_SECRET:test-captcha-secret-for-junit-tests-2026}
jwt.secret=${JWT_SECRET:test-secret-key-that-is-at-least-32-bytes-long}
jwt.expiration=${JWT_EXPIRATION:3600000}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:test-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test-api-secret}
app.cookie.secure=false
app.cookie.same-site=Lax
