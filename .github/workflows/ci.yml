name: Continuous Integration & Verification

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Build & Test (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/studentpg_ci
      CAPTCHA_SECRET: ci-test-captcha-secret-2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Confirm Maven and Java
        run: |
          java -version
          mvn --version

      - name: Run Backend Tests
        working-directory: backend
        run: mvn -B "-Dmaven.wagon.http.retryHandler.count=3" test

      - name: Package Backend Artifact
        working-directory: backend
        run: mvn -B "-Dmaven.wagon.http.retryHandler.count=3" clean package -DskipTests

  frontend-ci:
    name: Frontend Lint, Typecheck & Build (Next.js 15)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Frontend Unit & Regression Tests
        working-directory: frontend
        run: npm test

      # Audit level is set to critical. Two high advisories are accepted under current stack lock:
      # 1. zod (<4.6.6): Fix requires breaking upgrade to zod@4; mitigated by server-side array bounds and payload length limits.
      # 2. postcss (<=8.5.22, nested in next): Fix requires breaking upgrade to next@16; internal build dependency not exposed to runtime user CSS.
      - name: Run Production Dependency Security Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Build Next.js Production Bundle
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_APP_URL: https://studentpg.in
